<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Fourge — a daily word puzzle">
  <defs>
    <radialGradient id="glow" cx="50%" cy="-8%" r="80%">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.6" stop-color="#f7f3e9"/>
    </radialGradient>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#glow)"/>
  <rect x="22" y="22" width="1156" height="586" rx="30" fill="none" stroke="#e4ddca" stroke-width="2"/>

  <!-- header: green mark + gold wordmark -->
  <svg x="110" y="84" width="96" height="96" viewBox="0 0 100 100">
    <rect x="0" y="0" width="100" height="100" rx="22" fill="#18794e"/>
    <rect x="20" y="20" width="26" height="26" rx="6" fill="#fffdf7"/>
    <rect x="54" y="20" width="26" height="26" rx="6" fill="#e0a92b"/>
    <rect x="20" y="54" width="26" height="26" rx="6" fill="#fffdf7"/>
    <rect x="54" y="54" width="26" height="26" rx="6" fill="#fffdf7"/>
    <path d="M67 28.5 l1.7 4.1 4.1 1.7 -4.1 1.7 -1.7 4.1 -1.7 -4.1 -4.1 -1.7 4.1 -1.7 z" fill="#3a2600" opacity="0.9"/>
  </svg>
  <text x="234" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="92" font-weight="800" letter-spacing="0.5" fill="#c98a12">Fourge</text>

  <!-- tagline -->
  <text x="112" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="48" font-weight="800" fill="#1b1b1a">A daily word puzzle.</text>
  <text x="112" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="600" fill="#5c574c">Forge fragment tiles into words —</text>
  <text x="112" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="600" fill="#5c574c">find the 5 hidden Fourges.</text>

  <!-- footer: play pill + url -->
  <rect x="112" y="486" width="232" height="62" rx="31" fill="#18794e"/>
  <text x="228" y="527" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="28" font-weight="800" fill="#ffffff">Play free →</text>
  <text x="112" y="588" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="26" font-weight="600" fill="#8a8472">williammalone.github.io/fourge · no app, no signup</text>

  <!-- right visual: a solved Fourge over its four fragment tiles -->
  <g>
    <!-- gold Fourge gem -->
    <rect x="706" y="150" width="386" height="96" rx="18" fill="#e0a92b"/>
    <text x="899" y="211" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="44" font-weight="800" fill="#3a2600">motorbike</text>

    <!-- four fragment tiles -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1b1b1a">
      <rect x="706" y="300" width="86" height="86" rx="14" fill="#fffdf7" stroke="#e4ddca" stroke-width="1"/>
      <text x="749" y="350" text-anchor="middle" dominant-baseline="central">MOT</text>
      <rect x="806" y="300" width="86" height="86" rx="14" fill="#fffdf7" stroke="#e4ddca" stroke-width="1"/>
      <text x="849" y="350" text-anchor="middle" dominant-baseline="central">OR</text>
      <rect x="906" y="300" width="86" height="86" rx="14" fill="#fffdf7" stroke="#e4ddca" stroke-width="1"/>
      <text x="949" y="350" text-anchor="middle" dominant-baseline="central">BI</text>
      <rect x="1006" y="300" width="86" height="86" rx="14" fill="#18794e"/>
      <text x="1049" y="350" text-anchor="middle" dominant-baseline="central" fill="#ffffff">KE</text>
    </g>
  </g>
</svg>
