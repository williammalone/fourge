<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f7f3e9" />
    <!-- Apply the saved/system theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("fourge-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", t === "dark" ? "#14120e" : "#f7f3e9");
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Fourge — Free Daily Word Puzzle (Quartiles-style)</title>
    <meta name="description" content="Fourge is a free daily word puzzle in the style of Quartiles: forge 20 fragment tiles into words and find the 5 hidden Fourges. Play in your browser — no app, no signup — and challenge a friend on the same board." />

    <!-- Canonical -->
    <link rel="canonical" href="https://williammalone.github.io/fourge/" />

    <!-- Open Graph (iMessage, Slack, Discord, WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fourge" />
    <meta property="og:title" content="Fourge — a daily word puzzle" />
    <meta property="og:description" content="Forge fragment tiles into words and find the 5 hidden Fourges. Same board for everyone — challenge a friend and play head-to-head. No app, no signup." />
    <meta property="og:url" content="https://williammalone.github.io/fourge/" />
    <meta property="og:image" content="https://williammalone.github.io/fourge/og-image.png" />
    <meta property="og:image:secure_url" content="https://williammalone.github.io/fourge/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fourge — forge fragments into words and find the 5 hidden Fourges." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fourge — a daily word puzzle" />
    <meta name="twitter:description" content="Forge fragment tiles into words and find the 5 hidden Fourges. Challenge a friend — same board, head-to-head. No app, no signup." />
    <meta name="twitter:image" content="https://williammalone.github.io/fourge/og-image.png" />
    <meta name="twitter:image:alt" content="Fourge — forge fragments into words and find the 5 hidden Fourges." />

    <meta name="keywords" content="word game, daily word puzzle, Fourge, Quartiles, word puzzle, free word game, daily puzzle, play with a friend" />

    <!-- Structured data: rich Google result for a free web word game -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Fourge",
      "url": "https://williammalone.github.io/fourge/",
      "description": "A daily word puzzle. Forge fragment tiles into words and find the 5 hidden Fourges. Same board for everyone — challenge a friend and play head-to-head.",
      "applicationCategory": "GameApplication",
      "genre": "Word puzzle",
      "operatingSystem": "Any (modern web browser)",
      "browserRequirements": "Requires JavaScript",
      "image": "https://williammalone.github.io/fourge/og-image.png",
      "inLanguage": "en",
      "isAccessibleForFree": true,
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Fourge — a free daily word puzzle</h1>
      <p>
        Fourge is a free, Quartiles-style daily word game. Forge 20 letter-fragment
        tiles into words and find the 5 hidden Fourges. A free alternative to Apple's
        Quartiles — playable in any browser with no app and no signup. Enable
        JavaScript to play, or browse the <a href="/fourge/archive/">puzzle archive</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
