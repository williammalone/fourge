<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" role="img" aria-label="Fourge logo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd86b"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe49b"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>
  <!-- mark -->
  <g transform="translate(8,10)">
    <rect x="0" y="0" width="36" height="36" rx="8" fill="url(#tile)"/>
    <rect x="44" y="0" width="36" height="36" rx="8" fill="url(#gold)"/>
    <rect x="0" y="44" width="36" height="36" rx="8" fill="url(#tile)"/>
    <rect x="44" y="44" width="36" height="36" rx="8" fill="url(#tile)"/>
    <path d="M62 9 l2.4 5.6 5.6 2.4 -5.6 2.4 -2.4 5.6 -2.4 -5.6 -5.6 -2.4 5.6 -2.4 z" fill="#fff" opacity="0.92"/>
  </g>
  <!-- wordmark -->
  <text x="104" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="58" font-weight="800" letter-spacing="0.5" fill="url(#word)">Fourge</text>
</svg>
